<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KhaliMero AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-logo-wrapper">
                <svg viewBox="0 0 100 100" class="khalimero-svg-logo">
                    <defs>
                        <linearGradient id="khaliGradSplash" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00ff87" />
                            <stop offset="50%" stop-color="#60efff" />
                            <stop offset="100%" stop-color="#0061ff" />
                        </linearGradient>
                        <filter id="glowSplash" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="4" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <circle cx="50" cy="50" r="44" fill="#0f172a" stroke="url(#khaliGradSplash)" stroke-width="3" filter="url(#glowSplash)"/>
                    <path d="M 32 25 L 32 75 M 32 50 L 68 25 M 42 42 L 68 75" stroke="url(#khaliGradSplash)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <path d="M 72 28 Q 72 34 78 34 Q 72 34 72 40 Q 72 34 66 34 Q 72 34 72 28 Z" fill="#00ff87"/>
                </svg>
            </div>
            <h1 class="splash-title">KhaliMero AI</h1>
            <p class="splash-subtitle">INTELLIGENCE ARTIFICIELLE</p>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar closed" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="nouveauChat()">
                <span class="material-symbols-outlined">add</span>
                <span>Nouvelle discussion</span>
            </button>
        </div>
        <div class="sidebar-history" id="history-list">
            <!-- Historique dynamique -->
        </div>
        <div class="sidebar-footer">
            <button class="clear-all-btn" onclick="effacerTout()">
                <span class="material-symbols-outlined">delete_sweep</span>
                <span>Effacer l'historique</span>
            </button>
        </div>
    </aside>

    <!-- CONTAINER PRINCIPAL -->
    <main class="main-container">
        <header>
            <div class="header-left">
                <button class="icon-btn" onclick="toggleSidebar()">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <span class="logo-text">KhaliMero</span>
            </div>
            <div class="header-right">
                <!-- Bouton pour vider le chat actif -->
                <button class="icon-btn" onclick="viderChatActif()" title="Vider la discussion en cours">
                    <span class="material-symbols-outlined">cleaning_services</span>
                </button>
                <!-- Bouton basculement Thème Clair/Sombre -->
                <button class="icon-btn" onclick="basculerTheme()" title="Changer de thème">
                    <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
                </button>
                <div class="khalimero-logo-badge" title="KhaliMero AI">
                    <svg viewBox="0 0 100 100" class="khalimero-svg-logo">
                        <defs>
                            <linearGradient id="khaliGradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00ff87" />
                                <stop offset="50%" stop-color="#60efff" />
                                <stop offset="100%" stop-color="#0061ff" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="44" fill="#0f172a" stroke="url(#khaliGradHeader)" stroke-width="3"/>
                        <path d="M 32 25 L 32 75 M 32 50 L 68 25 M 42 42 L 68 75" stroke="url(#khaliGradHeader)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <path d="M 72 28 Q 72 34 78 34 Q 72 34 72 40 Q 72 34 66 34 Q 72 34 72 28 Z" fill="#00ff87"/>
                    </svg>
                </div>
            </div>
        </header>

        <!-- ZONE DE CHAT -->
        <div id="chat-container"></div>

        <!-- SAISIE UTILISATEUR FIXE -->
        <div id="input-container">
            <!-- Sélecteur de style pour les images (Apparaît en mode image) -->
            <div id="image-style-bar" class="image-style-bar" style="display: none;">
                <span class="style-label">🎨 Style :</span>
                <button class="style-pill active" data-style="photorealistic">Photoréaliste 4K</button>
                <button class="style-pill" data-style="cyberpunk">Cyberpunk Néon</button>
                <button class="style-pill" data-style="anime">Anime / Manga</button>
                <button class="style-pill" data-style="oil">Peinture à l'huile</button>
                <button class="style-pill" data-style="3d">Design 3D Pixar</button>
            </div>

            <div id="preview-box" style="display: none;">
                <img id="image-preview" src="" alt="Aperçu">
                <span id="remove-preview" onclick="supprimerImage()">✕</span>
            </div>
            <div class="input-box">
                <div class="attach-menu-wrapper">
                    <button class="icon-btn attach-btn" id="attach-trigger-btn" title="Ajouter une image ou photo" onclick="toggleAttachMenu(event)">
                        <span class="material-symbols-outlined">add</span>
                    </button>
                    <!-- MENU DÉROULANT -->
                    <div class="attach-dropdown" id="attach-dropdown-menu">
                        <label for="image-file-input" class="dropdown-item">
                            <span class="material-symbols-outlined">photo_library</span>
                            <span>Choisir une image</span>
                        </label>
                        <label for="camera-file-input" class="dropdown-item">
                            <span class="material-symbols-outlined">photo_camera</span>
                            <span>Prendre une photo</span>
                        </label>
                    </div>
                </div>

                <!-- INPUTS FICHIERS MASQUÉS -->
                <input type="file" id="image-file-input" accept="image/*" style="display: none;" onchange="chargerImage(event)">
                <input type="file" id="camera-file-input" accept="image/jpeg" capture="environment" style="display: none;" onchange="chargerImage(event)">

                <textarea id="user-input" placeholder="Posez votre question à KhaliMero..." rows="1" oninput="ajusterHauteur(this); mettreAJourCompteur(this);"></textarea>

                <button class="icon-btn" id="mic-btn" title="Dictée vocale" onclick="basculerDictéeVocale()">
                    <span class="material-symbols-outlined">mic</span>
                </button>

                <button class="icon-btn send-active" id="send-btn" title="Envoyer" onclick="envoyer()">
                    <span class="material-symbols-outlined">arrow_upward</span>
                </button>
            </div>
            <!-- Compteur de caractères -->
            <div class="input-footer-info">
                <span id="char-counter">0 / 2000</span>
                <p class="footer-note" style="margin:0;">KhaliMero peut faire des erreurs.</p>
            </div>
        </div>
    </main>

    <!-- VISIONNEUSE PHOTO -->
    <div id="image-modal" class="gemini-viewer" onclick="fermerModalImage(event)">
        <div class="viewer-top-bar">
            <button class="viewer-btn-close" onclick="fermerModalImageDirect()">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="viewer-content">
            <img id="img-modal-target" src="" alt="Aperçu Plein Écran">
        </div>
        <div class="viewer-bottom-bar">
            <a id="download-modal-btn" class="gemini-download-btn" href="" download target="_blank" onclick="event.stopPropagation()">
                <span class="material-symbols-outlined">download</span>
                <span>Télécharger l'image</span>
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
    </html>
